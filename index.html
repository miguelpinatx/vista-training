<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vista Training</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vista Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#834B9E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: one narrow column, lessons styled as grocery shelf tags, player takes the full column. */
:root{
  --paper:#F6F4FA; --surface:#FFFFFF; --ink:#1E1A24; --muted:#655E72; --line:#E2DDEA;
  --brand:#834B9E; --brand-ink:#FFFFFF; --blue:#007BC4; --tag:#FEC938; --tag-ink:#2A2100; --carrot:#F47321;
  --ok:#23824F; --ok-bg:#E3F4EA; --warn-bg:#FFF4E8; --lock:#B9B2C4;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --logo-bg:transparent;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141119; --surface:#1E1925; --ink:#F2EEF7; --muted:#A79FB4; --line:#332C3D;
  --brand:#B686D6; --brand-ink:#1A0F22; --blue:#55B3EC; --tag:#FEC938; --tag-ink:#2A2100; --carrot:#FF8A45;
  --ok:#5DC98D; --ok-bg:#16301F; --warn-bg:#33230F; --lock:#5A5266; --logo-bg:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141119; --surface:#1E1925; --ink:#F2EEF7; --muted:#A79FB4; --line:#332C3D;
  --brand:#B686D6; --brand-ink:#1A0F22; --blue:#55B3EC; --tag:#FEC938; --tag-ink:#2A2100; --carrot:#FF8A45;
  --ok:#5DC98D; --ok-bg:#16301F; --warn-bg:#33230F; --lock:#5A5266; --logo-bg:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,label,input,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:20px}
@media (min-width:768px){.wrap{max-width:760px}body{font-size:17px}.lesson{grid-template-columns:104px 1fr}}
h1,h2,h3{font-family:var(--display);font-stretch:85%;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--display);font-stretch:100%;font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:8px}
.mark{align-items:center}.mark img{height:46px;width:auto;display:block;background:var(--logo-bg);border-radius:10px;padding:4px 8px}
.mark span{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;background:var(--blue);color:#fff;padding:2px 8px;border-radius:99px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;color:var(--muted);font:700 .9rem var(--body);padding:10px 16px;min-height:44px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:16px}
.banner{background:var(--warn-bg);border:1px solid var(--line);border-left:4px solid var(--carrot);border-radius:8px;padding:10px 12px;font-size:.9rem}
label{display:grid;gap:6px;font-weight:700;font-size:.92rem}
input,select{font:16px var(--body);padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,.lesson:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.row2{grid-template-columns:1fr}}
.btn{-webkit-appearance:none;min-height:48px;appearance:none;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);font:800 1rem var(--body);padding:14px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--carrot);font-weight:700;font-size:.9rem}
.who{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.linkish{background:none;border:0;color:var(--blue);font:700 .95rem var(--body);cursor:pointer;padding:10px 0;min-height:44px}
/* progress meter */
.meter{display:grid;gap:6px}
.meter .bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
/* shelf-tag lessons */
.lessons{display:grid;gap:12px}
.lesson{display:grid;grid-template-columns:88px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;color:inherit;font:inherit;padding:0;width:100%}
.lesson[aria-disabled="true"]{cursor:not-allowed}
.lesson .tag{background:var(--tag);color:var(--tag-ink);display:grid;place-content:center;text-align:center;padding:12px 6px;position:relative}
.lesson .tag:after{content:"";position:absolute;right:-7px;top:50%;width:14px;height:14px;border-radius:50%;background:var(--surface);transform:translateY(-50%)}
.lesson[aria-disabled="true"] .tag{background:var(--lock);color:var(--surface)}
.lesson .tag small{font-family:var(--display);font-weight:700;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}
.lesson .tag strong{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1;font-stretch:80%}
.lesson .body{padding:14px 16px 14px 20px;display:grid;gap:6px;min-width:0}
.chip{justify-self:start;font-size:.75rem;font-weight:800;letter-spacing:.04em;padding:3px 10px;border-radius:99px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.chip.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.next{background:var(--brand);color:var(--brand-ink);border-color:transparent}
/* player */
.player{display:grid;gap:12px}
.vbox{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;max-width:100%}
.vbox video{width:100%;height:100%;display:block;background:#000}
.vbox .big{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;border:0;background:rgba(131,75,158,.92);color:#fff;font-size:1.6rem;cursor:pointer}
.ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctrls .btn{padding:10px 14px;font-size:.92rem}
.time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);margin-left:auto}
.track{height:14px;border-radius:99px;background:var(--line);position:relative;overflow:hidden;cursor:pointer}
.track .watched{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--brand) 35%,transparent)}
.track .now{position:absolute;inset:0 auto 0 0;background:var(--brand)}
.note{font-size:.88rem;color:var(--muted)}
/* quiz */
.q{display:grid;gap:8px;padding-block:14px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q legend{font-weight:800;padding:0;margin-bottom:4px}
.q fieldset{border:0;margin:0;padding:0;display:grid;gap:6px}
.opt{display:flex;gap:12px;align-items:flex-start;font-weight:600;padding:13px 14px;min-height:48px;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer}
.opt input,.ackbox input{width:22px;height:22px;flex:0 0 auto;margin-top:0;accent-color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--carrot)}
.score{font-family:var(--display);font-weight:800;font-size:3rem;font-stretch:80%;line-height:1}
.rd{display:grid;gap:14px}
.rd section{display:grid;gap:10px}
#rd-check section+section{padding-top:16px;border-top:1px solid var(--line)}
.rd h3{font-size:1.5rem;font-weight:800}
.rd ul{font-size:1.05rem}
.pgtop{display:grid;gap:8px}
.pgbar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.pgbar i{display:block;height:6px;border-radius:99px;background:var(--line)}
.pgbar i.on{background:var(--brand)}
.pgnav{display:flex;gap:10px}
.pgnav .btn{flex:1}
.pgnav .btn:disabled{visibility:hidden}
.rd ul{margin:0;padding-left:22px;display:grid;gap:4px}
.phone{background:var(--paper);border:2px solid var(--brand);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.phone strong{font-family:var(--display);font-size:1.6rem;font-weight:800;font-stretch:85%;font-variant-numeric:tabular-nums;color:var(--brand)}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:14px 1fr;gap:12px;padding-bottom:12px;position:relative}
.tl li:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--brand);margin-top:5px}
.tl li:not(:last-child):after{content:"";position:absolute;left:5px;top:19px;bottom:0;width:2px;background:var(--line)}
.tl b{display:block}
.steps{width:100%;border-collapse:collapse;font-size:.95rem}
.steps td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.steps td:first-child{font-weight:800;white-space:nowrap;color:var(--brand)}
.ackbox{display:flex;gap:12px;align-items:flex-start;font-weight:600;padding:6px 0;min-height:44px}
.ackbox input{width:auto;margin-top:4px}
.fb{font-size:.9rem;font-weight:700}
.fb.ok{color:var(--ok)}.fb.no{color:var(--carrot)}
.mgrbox{gap:12px;border:1px dashed var(--line);border-radius:12px;padding:14px;background:var(--paper)}
.banner.mgr{border-style:dashed}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;color:var(--muted);font:800 .95rem var(--body);padding:12px 8px;min-height:48px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.pin{font-size:1.4rem!important;letter-spacing:.5em;text-align:center;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:10px;font-weight:700;max-width:calc(100% - 32px);z-index:20}
.certcard{background:#fff;color:#1E1A24;border-radius:18px;padding:16px 16px 14px;border:3px solid #834B9E;box-shadow:inset 0 0 0 6px #fff,inset 0 0 0 8px #FEC938;display:grid;gap:8px;text-align:center}
.cc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cc-top img{height:38px;width:auto}
.cc-badge{font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;background:#007BC4;color:#fff;padding:4px 10px;border-radius:99px}
.cc-kicker{font-family:var(--display);font-weight:800;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#834B9E;margin-top:2px}
.cc-name{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:1.85rem;line-height:1.05;text-wrap:balance;border-bottom:2px solid #FEC938;padding-bottom:6px}
.cc-line{margin:0;color:#4b4555;font-weight:600;font-size:.92rem}
.cc-steps{list-style:none;margin:0;padding:0;display:grid;gap:3px;text-align:left;justify-self:center}
.cc-steps li{display:flex;gap:7px;align-items:center;font-weight:700;font-size:.86rem}
.cc-steps li:before{content:"✓";display:inline-grid;place-content:center;width:17px;height:17px;border-radius:50%;background:#23824F;color:#fff;font-size:.65rem;flex:0 0 auto}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:2px 0 0}
.cc-grid div{background:#F6F4FA;border-radius:10px;padding:6px 8px}
.cc-grid dt{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#655E72}
.cc-grid dd{margin:1px 0 0;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.cc-code{font-family:ui-monospace,Menlo,monospace;color:#834B9E}
body.certmode header.top,body.certmode #demo-banner{display:none!important}
body.certmode{padding-block:12px 24px}
#c-instr{padding:8px 12px;font-size:.88rem}
@media (max-height:620px){.certcard{gap:5px;padding:12px}.cc-top img{height:30px}.cc-name{font-size:1.45rem}.cc-steps li{font-size:.8rem}.cc-line{font-size:.85rem}#c-instr{font-size:.8rem;padding:6px 10px}}
.cert{border:2px dashed var(--brand);border-radius:var(--r);padding:20px;display:grid;gap:8px;text-align:center;background:var(--surface)}
.cert .big{font-family:var(--display);font-weight:800;font-size:1.6rem;font-stretch:85%}
@media (hover:hover){.lesson:not([aria-disabled="true"]):hover{border-color:var(--brand)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark"><img src="logo.png" alt="Vista Markets" width="111" height="46"><span id="t-badge">Training</span></div>
    <div class="lang" role="group" aria-label="Language" hidden><!-- Spanish: remove "hidden" here and set SPANISH_ON to true below -->
      <button type="button" id="lang-en" aria-pressed="true">English</button>
      <button type="button" id="lang-es" aria-pressed="false">Español</button>
    </div>
  </header>

  <div class="banner" id="demo-banner" hidden></div>

  <!-- SIGN IN -->
  <section id="v-start" class="panel">
    <div class="eyebrow" id="t-start-eyebrow"></div>
    <h1 id="t-start-title"></h1>
    <p class="muted" id="t-start-lead"></p>
    <div class="seg" role="group" aria-label="Sign in">
      <button type="button" id="mode-new" aria-pressed="true"></button>
      <button type="button" id="mode-back" aria-pressed="false"></button>
    </div>
    <form id="start-form" novalidate class="panel" style="padding:0;border:0;background:none">
      <label for="f-name"><span id="t-name"></span><input id="f-name" autocomplete="name" required></label>
      <div class="row2">
        <label for="f-date" id="w-date"><span id="t-date"></span><input id="f-date" type="date" required></label>
        <label for="f-store"><span id="t-store"></span><select id="f-store" required></select></label>
      </div>
      <div class="row2">
        <label for="f-pin"><span id="t-pin"></span><input id="f-pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="new-password" required></label>
        <label for="f-pin2" id="w-pin2"><span id="t-pin2"></span><input id="f-pin2" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="new-password" required></label>
      </div>
      <p class="muted" id="pin-hint" style="font-size:.9rem"></p>
      <p class="err" id="start-err" hidden></p>
      <button class="btn" type="submit" id="t-start-btn"></button>
    </form>
    <button class="linkish" type="button" id="mgr-link" style="justify-self:center">Manager? Open manager mode</button>
    <form id="mgr-form" novalidate class="panel mgrbox" hidden>
      <label for="m-pin"><span>Manager PIN</span><input id="m-pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" required></label>
      <p class="muted" style="font-size:.9rem">Opens every step so you can show the training. Videos can be skipped and nothing is saved.</p>
      <p class="err" id="mgr-err" hidden></p>
      <button class="btn" type="submit" id="mgr-btn">Open manager mode</button>
    </form>
  </section>

  <!-- COURSE -->
  <section id="v-course" hidden>
    <div class="wrap">
      <div class="who">
        <div><div class="eyebrow" id="t-course-eyebrow"></div><h1 id="who-name"></h1><p class="muted" id="who-meta"></p></div>
        <button class="linkish" type="button" id="t-signout"></button>
      </div>
      <div class="banner mgr" id="mgr-banner" hidden>Manager mode: every step is open, videos can be skipped, and nothing is saved.</div>
      <div class="meter" id="meter"><div class="bar"><i id="meter-fill"></i></div><span class="muted" id="meter-text"></span></div>
      <button class="btn" type="button" id="cert-open" hidden></button>
      <div class="lessons" id="lessons"></div>
      <p class="note" id="t-rules"></p>
      <button class="linkish" type="button" id="demo-unlock" hidden></button>
    </div>
  </section>

  <!-- PLAYER -->
  <section id="v-player" class="player" hidden>
    <button class="linkish" type="button" id="t-back" style="justify-self:start"></button>
    <div><div class="eyebrow" id="p-eyebrow"></div><h2 id="p-title"></h2></div>
    <div class="vbox" id="vbox">
      <video id="video" playsinline preload="metadata" disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback"></video>
      <button class="big" type="button" id="big-play" aria-label="Play">▶</button>
    </div>
    <div class="track" id="track" title="Tap anywhere you have already watched to go back"><div class="watched" id="tr-watched"></div><div class="now" id="tr-now"></div></div>
    <div class="ctrls">
      <button class="btn" type="button" id="c-play"></button>
      <button class="btn secondary" type="button" id="c-back10"></button>
      <button class="btn secondary" type="button" id="c-fwd10" hidden>10 sec ⟳</button>
      <button class="btn secondary" type="button" id="c-speed" aria-label="Playback speed">1x</button>
      <button class="btn secondary" type="button" id="c-full"></button>
      <span class="time" id="c-time">0:00 / 0:00</span>
    </div>
    <p class="note" id="t-noskip"></p>
    <div class="banner" id="p-done" hidden></div>
    <button class="btn" type="button" id="p-next" hidden></button>
  </section>

  <!-- READING: attendance -->
  <section id="v-read" class="panel" hidden>
    <button class="linkish" type="button" id="t-back3" style="justify-self:start"></button>
    <div><div class="eyebrow" id="rd-eyebrow"></div><h2 id="rd-title"></h2><p class="muted" id="rd-lead"></p></div>
    <div class="pgtop"><span class="eyebrow" id="rd-count"></span><div class="pgbar" id="rd-bar" aria-hidden="true"></div></div>
    <div class="rd" id="rd-body" aria-live="polite"></div>
    <div class="rd" id="rd-check"></div>
    <p class="err" id="rd-err" hidden></p>
    <div class="banner" id="rd-complete" hidden></div>
    <button class="btn" type="button" id="rd-nextstep" hidden></button>
    <div class="pgnav">
      <button class="btn secondary" type="button" id="rd-prev"></button>
      <button class="btn" type="button" id="rd-next"></button>
      <button class="btn" type="button" id="rd-done"></button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="v-quiz" class="panel" hidden>
    <button class="linkish" type="button" id="t-back2" style="justify-self:start"></button>
    <div><div class="eyebrow" id="t-quiz-eyebrow"></div><h2 id="t-quiz-title"></h2><p class="muted" id="t-quiz-lead"></p></div>
    <form id="quiz-form" novalidate></form>
    <p class="err" id="quiz-err" hidden></p>
    <button class="btn" type="button" id="t-submit"></button>
  </section>

  <!-- CERTIFICATE -->
  <section id="v-cert" hidden>
    <div class="wrap" style="gap:14px">
      <div class="banner" id="c-instr"></div>
      <div class="certcard" id="certcard">
        <div class="cc-top"><img src="logo.png" alt="Vista Markets" width="111" height="46"><span class="cc-badge" id="c-badge"></span></div>
        <div class="cc-kicker" id="c-kicker"></div>
        <div class="cc-name" id="c-name"></div>
        <p class="cc-line" id="c-line"></p>
        <ul class="cc-steps" id="c-steps"></ul>
        <dl class="cc-grid">
          <div><dt id="c-l-store"></dt><dd id="c-store"></dd></div>
          <div><dt id="c-l-start"></dt><dd id="c-start"></dd></div>
          <div><dt id="c-l-done"></dt><dd id="c-done"></dd></div>
          <div><dt id="c-l-code"></dt><dd id="c-code" class="cc-code"></dd></div>
        </dl>
      </div>
      <button class="btn secondary" type="button" id="c-home"></button>
    </div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <!-- RESULT -->
  <section id="v-result" class="panel" hidden>
    <div class="eyebrow" id="r-eyebrow"></div>

function stepState(i){

  if(st.k==="quiz"){if(isDone("quiz"))return "passed";if(!STEPS.slice(0,i).every(x=>isDone(x.k)))return "locked";return progress.quiz?"retake":"next"}
  if(isDone(st.k))return "done";
  if(i>0&&!isDone(STEPS[i-1].k))return "locked";
  if(st.type==="video"&&!CONFIG.VIDEOS[lang][st.k])return "soon";
  return "next";
}

    const open=st==="open"||st==="next"||st==="done"||st==="retake"||st==="passed";
    if(!open)b.setAttribute("aria-disabled","true");
    const tag=document.createElement("div");tag.className="tag";

function exampleDates(){

function renderQuiz(){

  QUIZ.forEach((q,qi)=>{

      const sp=document.createElement("span");sp.textContent=`${"abc"[oi]}) ${o}`;l.append(r,sp);fs.appendChild(l)});

  if(isMgr()){
    $("r-eyebrow").textContent="Manager mode";$("r-title").textContent=pass?"That's a passing score.":"That score wouldn't pass.";
    $("r-lead").textContent=`Employees need ${CONFIG.PASS_SCORE} of ${QUIZ.length} to pass. Nothing was saved.`;$("r-cert").hidden=true;
    $("r-btn").textContent="Review answers";$("r-btn").onclick=()=>{reviewQuiz(ans);show("v-quiz");window.scrollTo(0,0)};
  }
  show("v-result");window.scrollTo(0,0);
}
function reviewQuiz(ans){
  renderQuiz();
  QUIZ.forEach((q,qi)=>{const ok=$(`q${qi}o${q.a}`);if(ok){ok.checked=true;ok.parentElement.classList.add("right")}
    const pick=ans&&ans[qi];if(pick!=null&&pick!==q.a){const w=$(`q${qi}o${pick}`);if(w)w.parentElement.classList.add("wrong")}});
}
function markQuiz(ans){
  renderQuiz();
  QUIZ.forEach((q,qi)=>{const pick=ans[qi];const lbl=$(`q${qi}o${pick}`);if(lbl&&pick!==q.a)lbl.parentElement.classList.add("wrong");if(lbl)lbl.checked=false});
}

/* ---------- certificate ---------- */
function openCert(){
  const s=t(),c=me.cert;if(!c)return;
  const best=progress.quiz?`${progress.quiz.score}/${progress.quiz.total}`:"";
  const fdate=x=>new Date(x).toLocaleDateString(lang==="es"?"es-MX":"en-US",{year:"numeric",month:"long",day:"numeric"});
  $("c-instr").textContent=s.certInstr;$("c-badge").textContent=s.certBadge;$("c-kicker").textContent=s.certKicker;
  $("c-name").textContent=me.name;$("c-line").textContent=s.certLine;
  const ul=$("c-steps");ul.innerHTML="";s.certSteps(best).forEach(x=>{const li=document.createElement("li");li.textContent=x;ul.append(li)});
  $("c-l-store").textContent=s.certStore;$("c-store").textContent=me.store;
  $("c-l-start").textContent=s.certStart;$("c-start").textContent=fmtDate(me.date);
  $("c-l-done").textContent=s.certDone;$("c-done").textContent=fdate(c.at);
  $("c-l-code").textContent=s.certCode;$("c-code").textContent=c.code;
  $("c-home").textContent=s.certHome;
  show("v-cert");window.scrollTo(0,0);
}
$("c-home").addEventListener("click",()=>{renderCourse();show("v-course")});

/* ---------- sign in ---------- */
let mode="new";
function setMode(m){
  mode=m;const s=t(),isNew=m==="new";
  $("mode-new").setAttribute("aria-pressed",isNew);$("mode-back").setAttribute("aria-pressed",!isNew);
  $("w-date").hidden=!isNew;$("w-pin2").hidden=!isNew;
  $("t-pin").textContent=isNew?s.pin:s.pinBack;$("pin-hint").textContent=isNew?s.pinHintNew:s.pinHintBack;
  $("f-pin").autocomplete=isNew?"new-password":"current-password";
  $("t-start-btn").textContent=isNew?s.startBtn:s.backBtn;$("start-err").hidden=true;
}
$("mode-new").addEventListener("click",()=>setMode("new"));
$("mode-back").addEventListener("click",()=>setMode("back"));
["f-pin","f-pin2"].forEach(id=>$(id).addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,4)}));
$("start-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const s=t(),err=$("start-err"),fail=m=>{err.textContent=m;err.hidden=false};
  const name=$("f-name").value.trim().replace(/\s+/g," "),date=$("f-date").value,st=$("f-store").value,pin=$("f-pin").value;
  if(!name||!st||(mode==="new"&&!date))return fail(s.errFill);
  if(!/^\d{4}$/.test(pin))return fail(s.errPin);
  if(mode==="new"&&pin!==$("f-pin2").value)return fail(s.errPin2);
  err.hidden=true;const btn=$("t-start-btn");btn.disabled=true;
  const key=makeKey(name,st);
  try{
    const d=mode==="new"
      ?await api("training_register",{p_key:key,p_name:name,p_store:st,p_start_date:date,p_pin:pin,p_language:lang})
      :await api("training_login",{p_key:key,p_pin:pin});
    if(!d||!d.ok){
      const map={exists:s.errExists,not_found:s.errNotFound,wrong:s.errWrong,locked:s.errLocked,no_pin:s.errNoPin,bad_pin:s.errPin,missing:s.errFill};
      if(d&&d.error==="exists")setMode("back");
      return fail(map[d&&d.error]||s.errNet);
    }
    me={name,date,store:st,key,pin};
    applyState(d);
    $("f-pin").value="";$("f-pin2").value="";
    renderCourse();show("v-course");window.scrollTo(0,0);
  }catch(x){console.error(x);fail(s.errNet)}
  finally{btn.disabled=false}
});
$("mgr-link").addEventListener("click",()=>{const f=$("mgr-form");f.hidden=!f.hidden;if(!f.hidden)$("m-pin").focus()});
$("m-pin").addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,4)});
const sha256=async x=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(x)))].map(b=>b.toString(16).padStart(2,"0")).join("");
$("mgr-form").addEventListener("submit",async e=>{
  e.preventDefault();const err=$("mgr-err"),btn=$("mgr-btn"),pin=$("m-pin").value;
  if(!/^\d{4}$/.test(pin)){err.textContent="Enter the 4-digit manager PIN.";err.hidden=false;return}
  btn.disabled=true;
  let ok=false;try{ok=(await sha256("vista-mgr:"+pin))===CONFIG.MANAGER_PIN_SHA256}catch(x){console.error(x)}
  if(!ok){err.textContent="That PIN isn't right.";err.hidden=false;setTimeout(()=>btn.disabled=false,2000);$("m-pin").value="";return}
  btn.disabled=false;err.hidden=true;$("m-pin").value="";$("mgr-form").hidden=true;
  me={manager:true,name:"Manager mode",key:"manager",store:"",date:""};progress={};ss.set("vt-sess",me);
  renderCourse();show("v-course");window.scrollTo(0,0);
});
$("t-signout").addEventListener("click",()=>{ss.del("vt-sess");me=null;progress={};const d=$("f-date").value;$("start-form").reset();$("f-date").value=d;setMode("back");show("v-start")});
$("lang-en").addEventListener("click",()=>setLang("en"));$("lang-es").addEventListener("click",()=>setLang("es"));
$("demo-unlock").addEventListener("click",async()=>{for(const x of STEPS.filter(x=>x.type!=="quiz"))if(!progress[x.k])await record(x.k);renderCourse()});

/* ---------- boot ---------- */
applyText();
(()=>{const n=new Date();$("f-date").value=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`})();
(async()=>{
  if(me&&me.manager){progress={};renderCourse();show("v-course");return}
  if(me&&me.pin){try{const d=await loadProgress();if(d&&d.ok){renderCourse();show("v-course");return}}catch(x){}
    ss.del("vt-sess");me=null}
  show("v-start");
})();
</script>
</body>
</html>
